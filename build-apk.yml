name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add microphone permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n</manifest>#' "$M"
          cat "$M"

      - name: Add master-mode server and allow Wi-Fi (http) connections to the master
        run: |
          D=android/app/src/main/java/com/appinside/app
          cp android-src/LocalServerPlugin.java "$D/"
          cp android-src/MainActivity.java "$D/MainActivity.java"
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AppInside.apk

      - name: Check APK size (must stay under 100 MB)
        run: |
          SIZE=$(stat -c%s AppInside.apk)
          echo "APK size: $((SIZE/1024/1024)) MB ($SIZE bytes)"
          if [ "$SIZE" -gt 104857600 ]; then echo "APK is over 100 MB"; exit 1; fi

      - name: Make update bundle for live updates
        run: |
          VER=$(grep -oP "const APP_VERSION='\K[^']+" www/index.html)
          echo "{\"version\":\"$VER\"}" > version.json
          (cd www && zip -r ../bundle.zip .)
          cat version.json

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppInside-apk
          path: AppInside.apk

      - name: Publish APK as a phone-friendly download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppInside – latest build
          body: Download AppInside.apk on your Android phone and open it to install.
          files: |
            AppInside.apk
            bundle.zip
            version.json
          make_latest: true
